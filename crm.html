<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CRM Kancelarii</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#7c5cff;--bg:#0b0d14;--bg2:#10131c;--card:#151927;--card2:#1b2032;--line:#262c42;
  --txt:#e8eaf3;--mut:#8b92ad;--good:#2fd6a0;--bad:#ff6b81;--warn:#f5b84a;--info:#5aa9ff;
  --r:14px;--sh:0 10px 40px -14px rgba(0,0,0,.6);
}
[data-theme=light]{--bg:#f4f5fa;--bg2:#ffffff;--card:#ffffff;--card2:#eef0f6;--line:#e1e4ee;--txt:#151a2b;--mut:#646b85;--sh:0 8px 28px -16px rgba(30,40,80,.3)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.45;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
h1{font-size:1.45rem;letter-spacing:-.02em}h2{font-size:1.1rem}h3{font-size:1rem}
.proto{background:var(--warn);color:#1a1300;text-align:center;font-weight:700;font-size:.78rem;padding:5px 10px}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
.lbox{width:100%;max-width:760px}
.lbox h1{text-align:center;margin:10px 0 6px}
.lbox>p{text-align:center;color:var(--mut);margin-bottom:22px}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.ucard{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;transition:.2s;text-align:left}
.ucard:hover{border-color:var(--accent);transform:translateY(-2px)}
.ucard small{display:block;color:var(--mut)}
/* layout */
#app{display:none;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--bg2);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:800;font-size:1.02rem;display:flex;gap:10px;align-items:center;padding:4px 10px 16px}
.brand i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#2fd6a0);display:grid;place-items:center;font-style:normal;color:#fff;font-size:.85rem}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--mut);font-weight:600;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.nav:hover{background:var(--card)}.nav.on{background:var(--card2);color:var(--txt)}
.nav .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:20px;font-size:.72rem;padding:1px 7px;font-weight:700}
.nav .cnt.n{background:var(--accent)}
aside .sp{flex:1}
main{min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);z-index:20}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px 9px 34px;outline:none}
.search input:focus{border-color:var(--accent)}
.search::before{content:"⌕";position:absolute;left:12px;top:7px;color:var(--mut);font-size:1.1rem}
.sres{position:absolute;top:44px;left:0;right:0;background:var(--bg2);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);overflow:hidden;display:none}
.sres.show{display:block}
.sres a{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.sres a:hover{background:var(--card)}
.me{margin-left:auto;display:flex;align-items:center;gap:10px}
.me small{display:block;color:var(--mut);font-size:.75rem}
.content{padding:22px 24px 60px;max-width:1320px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.ph p{color:var(--mut);margin-top:2px}
/* elements */
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.75rem;color:#fff;flex:none}
.avs{display:flex}.avs .av{margin-left:-8px;border:2px solid var(--bg)}.avs .av:first-child{margin-left:0}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;white-space:nowrap;transition:.15s}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.del{color:var(--bad)}.btn.del:hover{border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;position:relative}
.icon-btn .dot{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;border-radius:20px;font-size:.66rem;padding:1px 5px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card>h3{margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;transition:.2s}
.tile:hover{border-color:var(--accent)}
.tile span{color:var(--mut);font-weight:600;font-size:.85rem}
.tile b{display:block;font-size:2rem;font-weight:800;margin:4px 0 2px;letter-spacing:-.02em}
.tile small{font-weight:600}
.f{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:none;width:100%;min-width:0}
.f:focus{border-color:var(--accent)}
textarea.f{resize:vertical;min-height:70px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.form label,.fl{display:grid;gap:5px;color:var(--mut);font-weight:600;font-size:.8rem}
.form .full{grid-column:1/-1}
.chk{display:flex!important;align-items:center;gap:8px;color:var(--txt)!important;font-weight:500!important;font-size:.88rem!important;cursor:pointer}
.chk input{accent-color:var(--accent);width:17px;height:17px}
table{width:100%;border-collapse:collapse}
th{color:var(--mut);font-weight:600;font-size:.76rem;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td b{white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--card2)}
.tw{overflow-x:auto}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:.74rem;font-weight:700;white-space:nowrap;background:var(--card2);color:var(--mut)}
.badge.cat{color:#fff}
.b-good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.b-bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.b-warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.b-info{background:color-mix(in srgb,var(--info) 18%,transparent);color:var(--info)}
.b-acc{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
.dotc{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.mut{color:var(--mut)}.small{font-size:.82rem}
.hint{color:var(--mut);font-size:.8rem;line-height:1.5;margin-top:8px}
.note{background:color-mix(in srgb,var(--warn) 12%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));border-radius:10px;padding:10px 12px;font-size:.84rem}
.note.info{background:color-mix(in srgb,var(--info) 10%,var(--card));border-color:color-mix(in srgb,var(--info) 40%,var(--line))}
.empty{color:var(--mut);text-align:center;padding:30px;border:1px dashed var(--line);border-radius:var(--r)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:.82rem;display:inline-flex;gap:6px;align-items:center}
.chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,var(--card))}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .f{width:auto}
/* case */
.chead{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}
.chead h1{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:16px 0 18px;overflow-x:auto}
.tab{padding:10px 14px;border:0;background:none;color:var(--mut);font-weight:600;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--txt);border-bottom-color:var(--accent)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;font-size:.9rem}
.kv dt{color:var(--mut)}
.stages{display:grid;gap:4px}
.stg{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.stg:hover{background:var(--card2)}.stg.on{border-color:var(--accent);background:var(--card2)}
.stg .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.78rem;font-weight:700;background:var(--card2);border:1px solid var(--line);flex:none}
.stg.approved .n{background:var(--good);border-color:var(--good);color:#06281d}
.stg.open .n{background:var(--accent);border-color:var(--accent);color:#fff}
.entry{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--bg2)}
.entry.locked{border-left:3px solid var(--good)}
.entry.draft{border-left:3px solid var(--warn)}
.entry .eh{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.entry .ea{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.file{display:inline-flex;gap:6px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:.8rem;margin:6px 6px 0 0}
.timeline{display:grid;gap:0}
.tl{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:.86rem}
.tl time{color:var(--mut)}
.diff{font-size:.8rem;color:var(--mut);margin-top:3px}.diff s{color:var(--bad)}.diff ins{color:var(--good);text-decoration:none}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{color:var(--mut);font-size:.75rem;font-weight:700;text-align:center;padding:4px}
.cal .d{min-height:74px;border:1px solid var(--line);border-radius:8px;padding:5px;font-size:.78rem;background:var(--bg2);overflow:hidden}
.cal .d.out{opacity:.35}.cal .d.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cal .d.hol{background:color-mix(in srgb,var(--bad) 7%,var(--bg2))}
.cal .ev{display:block;border-radius:5px;padding:1px 5px;margin-top:3px;color:#fff;font-size:.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.dl{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.dl .when{width:96px;flex:none;font-weight:700;font-size:.86rem}
.dl .what{flex:1;min-width:0}
.dl .what small{display:block;color:var(--mut)}
.st-overdue{color:var(--bad)}.st-urgent{color:var(--bad)}.st-soon{color:var(--warn)}.st-open{color:var(--info)}.st-done{color:var(--good)}
/* notif */
.nt{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card);cursor:pointer}
.nt.unread{border-left:3px solid var(--accent)}
.nt .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none}
.nt .ic.pilne{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.nt .ic.wazne{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.nt .ic.normalne{background:color-mix(in srgb,var(--info) 18%,transparent);color:var(--info)}
/* finance */
.alloc{display:grid;grid-template-columns:1.4fr 1.2fr 110px 120px 32px;gap:8px;align-items:center;margin-bottom:6px}
.bal{font-weight:800;padding:6px 12px;border-radius:10px;display:inline-block}
.bar{height:10px;border-radius:6px;background:var(--card2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
/* matrix */
.mx td,.mx th{text-align:center;padding:7px}
.mx td:first-child,.mx th:first-child{text-align:left}
.m-full{color:var(--good);font-weight:800}.m-lim{color:var(--warn);font-weight:800}.m-none{color:var(--mut)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(5,7,12,.65);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 16px;overflow:auto}
.modal.show{display:flex}
.mbox{background:var(--bg2);border:1px solid var(--line);border-radius:18px;width:100%;max-width:640px;padding:22px;box-shadow:var(--sh)}
.mbox.wide{max-width:900px}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--card2);border:1px solid var(--accent);padding:12px 16px;border-radius:12px;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none;z-index:200;max-width:380px}
.toast.show{opacity:1;transform:none}
.toast.err{border-color:var(--bad)}
.forbid{text-align:center;padding:60px 20px}
.forbid b{font-size:3rem;display:block;color:var(--bad)}
.lock{font-size:.8rem}
.calcbox{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.res .main{font-size:1.7rem;font-weight:800;margin:2px 0 10px}
.res .sub{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:.88rem}
.svgchart text{fill:var(--mut);font-size:11px;font-family:inherit}
@media(max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2,.calcbox{grid-template-columns:1fr}}
@media(max-width:760px){#app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.brand{width:100%}aside .sp,.me small{display:none}.content{padding:16px}.top{padding:10px 16px}.kv{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login"><div class="lbox">
  <div style="text-align:center;font-size:2rem">⚖️</div>
  <h1>CRM Kancelarii</h1>
  <p>Prototyp: wybierz osobę, aby zobaczyć system z perspektywy jej roli. W wersji produkcyjnej: hasło + 2FA.</p>
  <div class="ugrid" id="users"></div>
  <p class="hint" style="text-align:center;margin-top:18px"><a href="index.html" style="color:var(--accent)">← Strona dla klientów</a> · <a href="#" id="resetAll" style="color:var(--accent)">Przywróć dane przykładowe</a></p>
</div></div>
<div id="app">
  <aside id="side"></aside>
  <main>
    <div class="top">
      <div class="search"><input id="q" placeholder="Szukaj sprawy, klienta, sygnatury…" autocomplete="off"><div class="sres" id="sres"></div></div>
      <div class="me">
        <button class="icon-btn" id="bell" title="Powiadomienia">🔔</button>
        <button class="icon-btn" id="theme" title="Motyw">🌓</button>
        <div id="meBox" style="display:flex;gap:10px;align-items:center"></div>
        <button class="btn sm" id="logout">Wyloguj</button>
      </div>
    </div>
    <div class="content" id="view"></div>
  </main>
</div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* =====================================================================
   CRM Kancelarii — PROTOTYP (bez backendu).
   Warstwa „api.*” udaje serwer: sprawdza uprawnienia i zwraca 403.
   W wersji produkcyjnej te same reguły egzekwuje Supabase (RLS + funkcje).
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=s=>{const [y,m,d]=String(s).slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dayDiff=(a,b)=>Math.round((parseD(iso(b))-parseD(iso(a)))/864e5);
const fD=s=>{if(!s)return '—';const d=parseD(s);return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`};
const fDT=s=>{if(!s)return '—';const d=new Date(s);return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const DOW=['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota'];
const money=v=>Number.isFinite(+v)?(+v).toLocaleString('pl-PL',{minimumFractionDigits:0,maximumFractionDigits:2})+' zł':'—';
const nowISO=()=>new Date().toISOString();
const initials=n=>n.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
const COLORS=['#7c5cff','#2fd6a0','#f59e0b','#ef4444','#3b82f6','#ec4899','#14b8a6','#8b5cf6'];

/* --- SHA-256 (synchronicznie, do łańcucha audytu) --- */
function sha256(str){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const b=new TextEncoder().encode(str),l=b.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);m.set(b);m[l]=0x80;
  const bits=l*8;for(let i=0;i<8;i++)m[n-1-i]=Math.floor(bits/2**(8*i))&255;
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];const w=new Uint32Array(64),r=(x,k)=>(x>>>k)|(x<<(32-k));
  for(let o=0;o<n;o+=64){
    for(let i=0;i<16;i++)w[i]=(m[o+i*4]<<24)|(m[o+i*4+1]<<16)|(m[o+i*4+2]<<8)|m[o+i*4+3];
    for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3),s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
    let [a,b2,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){const S1=r(e,6)^r(e,11)^r(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+w[i])|0,S0=r(a,2)^r(a,13)^r(a,22),mj=(a&b2)^(a&c)^(b2&c),t2=(S0+mj)|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b2;b2=a;a=(t1+t2)|0}
    H=H.map((v,i)=>(v+[a,b2,c,d,e,f,g,h][i])|0);
  }
  return H.map(v=>(v>>>0).toString(16).padStart(8,'0')).join('');
}

/* --- Święta (stałe + ruchome) --- */
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
function holidaySet(y){
  const m=new Map();
  (DB?.holidays||[]).forEach(h=>{if(h.fixed)m.set(`${y}-${h.date}`,h.name);else if(h.date.startsWith(y+'-'))m.set(h.date,h.name)});
  if(DB?.holidaysMovable!==false){const e=easter(y);m.set(iso(e),'Wielkanoc');m.set(iso(addDays(e,1)),'Poniedziałek Wielkanocny');m.set(iso(addDays(e,49)),'Zielone Świątki');m.set(iso(addDays(e,60)),'Boże Ciało')}
  return m;
}
const holidayName=d=>holidaySet(d.getFullYear()).get(iso(d));
const isFree=d=>d.getDay()===0||d.getDay()===6||!!holidayName(d);
function nextWorkday(d){let x=new Date(d),n=0;while(isFree(x)&&n<20){x=addDays(x,1);n++}return x}
/* kalkulator terminu: art. 111–112 i 115 KC (do weryfikacji prawnika) */
function computeDeadline(trigger,len,unit){
  const t=parseD(trigger);let due;
  if(unit==='dni')due=addDays(t,+len);
  else if(unit==='tygodnie')due=addDays(t,7*len);
  else{const months=unit==='lata'?12*len:+len,y=t.getFullYear(),mo=t.getMonth()+months,last=new Date(y,mo+1,0).getDate();due=new Date(y,mo,Math.min(t.getDate(),last))}
  const fin=nextWorkday(due),moved=iso(fin)!==iso(due);
  const why=moved?`${fD(iso(due))} to ${isFree(due)&&holidayName(due)?holidayName(due):DOW[due.getDay()]} → następny dzień roboczy`:'dzień roboczy — bez przesunięcia';
  return{computed:iso(due),final:iso(fin),moved,why,formula:`${fD(trigger)} + ${len} ${unit} = ${fD(iso(due))} (${DOW[due.getDay()]})`};
}

/* --- Dziennik audytu: tylko dopisywanie, łańcuch skrótów (§12) --- */
function audit(action,target,details){
  const prev=DB.audit.length?DB.audit[DB.audit.length-1].hash:'0'.repeat(64);
  const e={i:DB.audit.length+1,ts:nowISO(),user:ME?.id||'system',action,target:target||'',details:details||''};
  e.prev=prev;e.hash=sha256(prev+JSON.stringify([e.i,e.ts,e.user,e.action,e.target,e.details]));
  DB.audit.push(e);
}
function verifyAudit(){
  let prev='0'.repeat(64);
  for(const e of DB.audit){const h=sha256(prev+JSON.stringify([e.i,e.ts,e.user,e.action,e.target,e.details]));if(e.prev!==prev||e.hash!==h)return{ok:false,at:e.i};prev=e.hash}
  return{ok:true,n:DB.audit.length};
}

/* --- Powiadomienia (§10) --- */
function notify(type,caseId,title,body,recipients,opt={}){
  const c=caseId&&CASE(caseId);
  [...new Set(recipients)].filter(Boolean).forEach(rid=>{
    const u=U(rid);if(!u.id)return;
    if(c&&!canCase(c,u))return; // odbiorca tylko ze spraw, do których ma dostęp
    if(opt.finance&&!(can('initial_fee',u)||isAdmin(u)))return;
    const key=opt.key?`${opt.key}:${rid}`:null;
    if(key&&DB.notifications.some(n=>n.key===key))return; // każde przypomnienie dokładnie raz
    DB.notifications.unshift({id:uid('n'),key,recipient:rid,type,caseId:caseId||null,title,body:body||'',priority:opt.priority||'normalne',action:!!opt.action,created:nowISO(),read:null,done:null});
  });
}

/* --- Statusy terminów (§5) --- */
function dlStatus(d){
  if(d.status==='done')return{k:'done',label:'wykonany',cls:'b-good'};
  const n=dayDiff(today(),parseD(d.final));
  if(n<0)return{k:'overdue',label:'przekroczony',cls:'b-bad',n};
  if(n<=1)return{k:'urgent',label:'pilny',cls:'b-bad',n};
  if(n<=7)return{k:'soon',label:'zbliża się',cls:'b-warn',n};
  return{k:'open',label:'otwarty',cls:'b-info',n};
}
const whenTxt=n=>n===0?'dziś':n===1?'jutro':n===-1?'wczoraj':n>0?`za ${n} dni`:`${-n} dni po terminie`;
/* zadanie cykliczne (w produkcji co 15 min po stronie serwera) */
function runJobs(){
  const t=today(),ti=iso(t);
  DB.deadlines.filter(d=>d.status!=='done'&&!d.deleted).forEach(d=>{
    const c=CASE(d.caseId);if(!c||c.deleted)return;const lead=leadOf(c)?.userId,n=dayDiff(t,parseD(d.final));
    const base=[d.responsible],ctrl=d.controller?[d.controller]:[];
    const steps=[[14,'T-14',base,'normalne'],[7,'T-7',[...base,...ctrl],'normalne'],[3,'T-3',[...base,...ctrl,lead],'wazne'],[1,'T-1',[...base,...ctrl,lead],'pilne'],[0,'T-0',[...base,...ctrl,lead],'pilne']];
    // najbliższy osiągnięty próg (np. 5 dni do terminu → T-7); każdy próg generuje się dokładnie raz
    const st=n>=0?steps.filter(s=>n<=s[0]).pop():null;
    if(st){const [k,lab,rcp,pr]=st;notify('deadline.approaching',c.id,`${k===0?'Dziś mija termin':'Zbliża się termin'}: ${d.title}`,`${c.number} · ${fD(d.final)}${d.time?' '+d.time:''} · ${lab}`,rcp,{priority:pr,action:k<=1,key:`${d.id}:${lab}`})}
    if(n<0)notify('deadline.overdue',c.id,`Przekroczony termin: ${d.title}`,`${c.number} · ${-n} dni po terminie — eskalacja`,[...base,lead,...admins()],{priority:'pilne',action:true,key:`${d.id}:over:${ti}`});
  });
  // wygasłe nadania uprawnień
  Object.entries(DB.overrides||{}).forEach(([u,o])=>Object.entries(o).forEach(([p,v])=>{if(v.until&&v.until<ti&&!v.expiredLogged){v.expiredLogged=true;audit('uprawnienie.wygaslo',U(u).name,`${PERM_NAME[p]} (ważne do ${fD(v.until)})`)}}));
}

function modal(title,body,{ok='Zapisz',wide=false,onOk,cancel='Anuluj',danger=false}={}){

  $('#mbox').innerHTML=`<div class="mhead"><h2>${esc(title)}</h2><button class="icon-btn" data-x>✕</button></div><form id="mform">${body}<div class="mfoot">${cancel?`<button type="button" class="btn" data-x>${esc(cancel)}</button>`:''}${ok?`<button class="btn ${danger?'del':'pri'}">${esc(ok)}</button>`:''}</div></form>`;
  M.classList.add('show');$$('[data-x]',M).forEach(b=>b.onclick=closeModal);
  $('#mform').onsubmit=e=>{e.preventDefault();try{const r=onOk?.(Object.fromEntries(new FormData(e.target)),e.target);if(r!==false)closeModal()}catch(err){if(err.code===403)toast(err.message,true);else{console.error(err);toast(err.message||'Błąd',true)}}};

function route(){
  if(!ME)return;

  const [,page='pulpit',a,b]=location.hash.split('/');

  const dls=DB.deadlines.filter(d=>d.status!=='done'&&!d.deleted&&cs.some(c=>c.id===d.caseId));
  const todayDl=dls.filter(d=>d.final===t),urgent=dls.filter(d=>['overdue','urgent'].includes(dlStatus(d).k));
  const tasks=dls.filter(d=>d.type==='internal'),unread=DB.notifications.filter(n=>n.recipient===ME.id&&!n.read);
  const fresh=cs.filter(c=>dayDiff(parseD(c.openedAt),today())<=7).length;
  const recent=[...cs].sort((a,b)=>b.openedAt.localeCompare(a.openedAt)).slice(0,6);
  const near=[...dls].sort((a,b)=>a.final.localeCompare(b.final)).slice(0,6);
  return `<div class="ph"><div><h1>Dzień dobry, ${esc(ME.name.split(' ')[0])}</h1><p>${fD(t)} · ${DOW[today().getDay()]}${isAdmin()?' · widok Administratora: wszystkie sprawy':' · dane z Twoich spraw'}</p></div></div>

    <a class="tile" href="#/sprawy"><span>${isAdmin()?'Sprawy w toku':'Moje sprawy'}</span><b>${open.length}</b><small class="mut">${fresh?`+${fresh} nowe w tym tygodniu`:'bez nowych'}</small></a>
    <a class="tile" href="#/terminy"><span>Terminy na dziś</span><b>${todayDl.length}</b><small class="${urgent.length?'st-overdue':'mut'}">${urgent.length?`${urgent.length} pilne / przekroczone`:'nic pilnego'}</small></a>
    <a class="tile" href="#/terminy"><span>Niezrealizowane zadania</span><b>${tasks.length}</b><small class="mut">zadania wewnętrzne</small></a>
    <a class="tile" href="#/powiadomienia"><span>Powiadomienia</span><b>${unread.length}</b><small class="mut">${unread.filter(n=>n.action).length} wymaga działania</small></a>
  </div>
  <div class="grid g2">
    <div class="card"><h3>Ostatnie sprawy <a class="btn sm" href="#/sprawy">Wszystkie →</a></h3>${caseTable(recent,true)}</div>
    <div class="card"><h3>Najbliższe terminy <a class="btn sm" href="#/terminy">Kalendarz →</a></h3>${near.length?near.map(dlRow).join(''):'<div class="empty">Brak otwartych terminów</div>'}</div>
  </div>`;
};
function caseTable(list,compact){
  if(!list.length)return '<div class="empty">Brak spraw</div>';
  return `<div class="tw"><table><tr><th>Nr sprawy</th><th>Klient</th>${compact?'':'<th>Rodzaj</th><th>Pełnomocnik</th><th>Najbliższy termin</th>'}<th>Status</th></tr>${list.map(c=>{

function timeline(list){
  if(!list.length)return '<div class="empty">Brak zdarzeń</div>';
  return `<div class="timeline">${list.map(h=>`<div class="tl"><time>${fDT(h.ts)}</time><div><b>${esc(U(h.user).name)}</b> · ${esc(h.text)}${h.field?`<div class="diff">${esc(h.field)}: <s>${esc(h.before??'—')}</s> → <ins>${esc(h.after??'—')}</ins></div>`:''}</div></div>`).join('')}</div>`;
}
CTAB.historia=c=>`<div class="card"><h3>Historia działań <span class="mut small">tylko do odczytu</span></h3>${timeline(DB.history.filter(h=>h.caseId===c.id).slice().reverse())}</div>`;

/* --- Etapy, wpisy, korekty (§4, §7) --- */
let selStage={};
CTAB.etapy=c=>{
  const st=DB.stages.filter(s=>s.caseId===c.id).sort((a,b)=>a.order-b.order),f=caseFlags(c);
  const cur=st.find(s=>s.id===selStage[c.id])||st.find(s=>s.status==='open')||st[st.length-1];selStage[c.id]=cur.id;
  const entries=DB.entries.filter(e=>e.stage===cur.id&&!e.deleted),docs=DB.documents.filter(d=>d.stage===cur.id&&!d.deleted);
  const canAdd=f.actions&&(cur.status!=='approved'||isAdmin())&&cur.status!=='todo';
  const canApproveStage=cur.status==='open'&&(isAdmin()||f.approve);
  const corr=DB.corrections.filter(k=>k.caseId===c.id&&k.status==='pending');
  return `<div class="grid" style="grid-template-columns:280px 1fr;align-items:start">
  <div class="card" style="padding:10px"><div class="stages">${st.map(s=>`<div class="stg ${s.status} ${s.id===cur.id?'on':''}" onclick="selStage['${c.id}']='${s.id}';rerender()"><span class="n">${s.status==='approved'?'✓':s.order}</span><div><b style="font-size:.88rem">${esc(s.name)}</b><br><small class="mut">${s.status==='approved'?'zatwierdzony · zablokowany':s.status==='open'?'w trakcie':'oczekuje'}</small></div></div>`).join('')}</div></div>
  <div>
    ${isAdmin()&&corr.length?`<div class="note" style="margin-bottom:12px"><b>Wnioski o korektę do decyzji (${corr.length})</b>${corr.map(k=>{const e=DB.entries.find(x=>x.id===k.entryId);return `<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:8px"><span>${esc(U(k.by).name)}: „${esc(e?.title)}” — ${esc(k.reason)}</span><span><button class="btn sm pri" onclick="decideCorrection('${k.id}',true)">Zatwierdź</button> <button class="btn sm del" onclick="decideCorrection('${k.id}',false)">Odrzuć</button></span></div>`}).join('')}</div>`:''}
    <div class="card"><h3><span>${cur.order}. ${esc(cur.name)} ${cur.status==='approved'?'<span class="badge b-good">🔒 zatwierdzony</span>':cur.status==='open'?'<span class="badge b-acc">otwarty</span>':'<span class="badge">oczekuje</span>'}</span>
      <span style="display:flex;gap:6px">${canAdd?`<button class="btn sm" onclick="entryModal('${c.id}','${cur.id}')">+ Wpis</button>`:''}${canApproveStage?`<button class="btn sm pri" onclick="approveStage('${cur.id}')">Zatwierdź etap</button>`:''}</span></h3>
      <p class="mut small">Odpowiedzialny: ${esc(U(cur.responsible).name)}${cur.approvedAt?` · zatwierdził: ${esc(U(cur.approvedBy).name)}, ${fDT(cur.approvedAt)}`:''}${cur.conflict?` · wynik kontroli konfliktu: <b>${esc(cur.conflict)}</b>`:''}</p>
      ${cur.status==='approved'?'<div class="note info" style="margin-top:10px">Etap zatwierdzony — wpisy i załączniki są zablokowane. Zmiana tylko przez wniosek o korektę (decyduje Administrator).</div>':''}
      <div style="margin-top:14px">${entries.length?entries.map(e=>entryCard(e,c,cur)).join(''):'<div class="empty">Brak wpisów w tym etapie</div>'}</div>
      ${docs.length?`<h3 style="margin:14px 0 8px">Dokumenty etapu</h3>${docs.map(d=>`<span class="file">📎 ${esc(d.name)} · v${d.versions.length}</span>`).join('')}`:''}</div>
    <div class="card" style="margin-top:14px"><h3>Kto może usunąć lub zmienić wpis?</h3><div class="tw"><table><tr><th>Akcja</th><th>Aplikant / Pełnomocnik</th><th>Administrator</th></tr>
      <tr><td>Dodać wpis, dokument, zadanie</td><td class="st-done">TAK</td><td class="st-done">TAK</td></tr>
      <tr><td>Edytować własny wpis przed zatwierdzeniem</td><td class="st-done">TAK (zapis wersji)</td><td class="st-done">TAK</td></tr>
      <tr><td>Usunąć wpis po jego zapisaniu</td><td class="st-overdue">NIE</td><td class="st-done">TAK, z uzasadnieniem</td></tr>
      <tr><td>Zmienić / usunąć wpis po zatwierdzeniu etapu</td><td class="st-overdue">NIE — wniosek o korektę</td><td class="st-done">TAK, z uzasadnieniem</td></tr>
      <tr><td>Zmienić wpis w dzienniku audytu</td><td class="st-overdue">NIE</td><td class="st-overdue">NIE (nikt)</td></tr></table></div></div>
  </div></div>`;
};
function entryCard(e,c,stage){
  const locked=e.locked||stage.status==='approved',mine=e.performedBy===ME.id||e.author===ME.id,f=caseFlags(c);
  const pend=DB.corrections.find(k=>k.entryId===e.id&&k.status==='pending');
  const acts=[];
  if(!locked&&mine)acts.push(`<button class="btn sm" onclick="entryModal('${c.id}','${stage.id}','${e.id}')">Edytuj (zapis wersji)</button>`);
  if(!locked&&(isAdmin()||f.approve))acts.push(`<button class="btn sm" onclick="approveEntry('${e.id}')">Zatwierdź wpis</button>`);
  if(locked&&!isAdmin()&&!pend)acts.push(`<button class="btn sm" onclick="correctionModal('${e.id}')">Wniosek o korektę</button>`);
  if(locked&&isAdmin())acts.push(`<button class="btn sm" onclick="entryModal('${c.id}','${stage.id}','${e.id}',true)">Popraw (z uzasadnieniem)</button>`);
  if(isAdmin())acts.push(`<button class="btn sm del" onclick="deleteEntry('${e.id}')">Usuń</button>`);
  return `<div class="entry ${locked?'locked':'draft'}"><div class="eh"><div style="display:flex;gap:10px;align-items:center">${av(e.performedBy)}<div><b>${esc(e.title)}</b><br><small class="mut">${esc(U(e.performedBy).name)} · ${fD(e.performedOn)} · ${esc(e.type)}${e.kind?' / '+esc(e.kind):''}</small></div></div>
    <span class="badge ${locked?'b-good':'b-warn'}">${locked?'🔒 Zatwierdzone · zablokowane':'Roboczy · edytowalny'}</span></div>
    ${e.desc?`<p style="margin-top:8px;white-space:pre-wrap">${esc(e.desc)}</p>`:''}${(e.files||[]).map(x=>`<span class="file">📎 ${esc(x)}</span>`).join('')}
    ${e.next?`<div class="small" style="margin-top:6px">⏭ Kolejna czynność: <b>${fD(e.next)}</b> (w Terminach)</div>`:''}
    ${e.approvedBy?`<div class="small mut" style="margin-top:6px">Zatwierdził: ${esc(U(e.approvedBy).name)} · ${fDT(e.approvedAt)}</div>`:''}
    ${pend?`<div class="note" style="margin-top:8px">Wniosek o korektę czeka na decyzję Administratora: ${esc(pend.reason)}</div>`:''}
    ${e.versions?.length?`<details style="margin-top:8px"><summary class="small mut" style="cursor:pointer">Historia korekt (${e.versions.length})</summary>${e.versions.map(v=>`<div class="small" style="margin-top:6px;padding-left:10px;border-left:2px solid var(--line)">${fDT(v.at)} · ${esc(U(v.by).name)}${v.reason?` · <i>${esc(v.reason)}</i>`:''}<br><b>${esc(v.title)}</b> — ${esc(v.desc)}</div>`).join('')}</details>`:''}
    <div class="ea">${acts.join('')}</div></div>`;
}
function entryModal(caseId,stageId,entryId,adminFix){
  const c=CASE(caseId),e=entryId&&DB.entries.find(x=>x.id===entryId),f=caseFlags(c);
  need(f.actions,'Brak uprawnienia do czynności w tej sprawie.');
  modal(e?(adminFix?'Korekta zatwierdzonego wpisu':'Edytuj wpis'):'Nowy wpis',`<div class="form">
    <label>Typ<select class="f" name="type"><option ${e?.type==='czynność'?'selected':''}>czynność</option><option ${e?.type==='notatka'?'selected':''}>notatka</option></select></label>
    <label>Rodzaj<select class="f" name="kind">${ENTRY_KINDS.map(k=>`<option ${e?.kind===k?'selected':''}>${k}</option>`).join('')}</select></label>
    <label class="full">Nazwa czynności<input class="f" name="title" required value="${esc(e?.title||'')}"></label>
    <label class="full">Opis wykonanej pracy<textarea class="f" name="desc">${esc(e?.desc||'')}</textarea></label>
    <label>Data wykonania<input class="f" type="date" name="performedOn" value="${e?.performedOn||iso(today())}"></label>
    <label>Termin kolejnej czynności<input class="f" type="date" name="next" value="${e?.next||''}"></label>
    ${e?'':`<label class="full">Załączniki<input class="f" type="file" name="files" multiple accept=".pdf,.doc,.docx,.odt,.xlsx,.jpg,.png,.txt"></label>`}
    ${adminFix?'<label class="full">Uzasadnienie korekty<textarea class="f" name="reason" required minlength="5"></textarea></label>':''}</div>
    <p class="hint">${e?'Poprzednia treść zostanie zachowana w „Historii korekt”.':'Wpis jest roboczy do zatwierdzenia etapu — możesz go edytować (każda edycja = wersja). Usunąć zapisany wpis może tylko Administrator.'} Termin kolejnej czynności tworzy zadanie w module Terminy.</p>`,{onOk:(v,form)=>{
    if(e){
      need(isAdmin()||(!e.locked&&e.performedBy===ME.id),'Edycja zablokowanego lub cudzego wpisu — 403.');
      e.versions.push({at:nowISO(),by:ME.id,title:e.title,desc:e.desc,reason:v.reason||''});
      Object.assign(e,{type:v.type,kind:v.kind,title:v.title,desc:v.desc,performedOn:v.performedOn,next:v.next||null});
      hist(c.id,`${adminFix?'Korekta (Administrator)':'Edycja wpisu'}: ${e.title}`);audit(adminFix?'wpis.korekta_admin':'wpis.edycja',c.number,`${e.title}${v.reason?' · '+v.reason:''}`);
    }else{
      const files=[...(form.files?.files||[])].map(x=>x.name);
      const ne={id:uid('e'),caseId:c.id,stage:stageId,type:v.type,kind:v.kind,title:v.title,desc:v.desc,performedOn:v.performedOn,performedBy:ME.id,approvedBy:null,approvedAt:null,next:v.next||null,status:'draft',locked:false,files,versions:[],created:nowISO()};
      DB.entries.push(ne);
      files.forEach(n=>{DB.documents.push({id:uid('d'),caseId:c.id,stage:stageId,name:n,versions:[{v:1,at:nowISO(),by:ME.id,size:'—',sha:sha256(n+Date.now())}],deleted:false})});
      if(files.length)notify('document.added',c.id,`Dodano dokument: ${files.join(', ')}`,c.number,teamOf(c).map(m=>m.userId).filter(u=>u!==ME.id));
      hist(c.id,`Dodano wpis: ${v.title}`);audit('wpis.dodany',c.number,v.title);
      if(v.next)DB.deadlines.push({id:uid('t'),caseId:c.id,type:'internal',title:`Kolejna czynność: ${v.title}`,trigger:null,len:null,unit:'dni',computed:v.next,final:v.next,time:'',responsible:ME.id,controller:null,controllerOk:null,status:'open',versions:[],created:nowISO()});
    }
    save();rerender();
  }});
}
function approveEntry(id){const e=DB.entries.find(x=>x.id===id),c=CASE(e.caseId);need(isAdmin()||caseFlags(c).approve,'Brak uprawnienia do zatwierdzania.');e.approvedBy=ME.id;e.approvedAt=nowISO();e.locked=true;e.status='approved';hist(c.id,`Zatwierdzono wpis: ${e.title}`);audit('wpis.zatwierdzony',c.number,e.title);save();rerender()}
function deleteEntry(id){
  const e=DB.entries.find(x=>x.id===id),c=CASE(e.caseId);
  if(!isAdmin()){audit('odmowa.dostepu','DELETE wpis',`${ME.name} → ${e.title}`);save();toast('403 — usuwa tylko Administrator. Próba zapisana w audycie.',true);return}
  askReason('Usuń wpis',`Uzasadnienie usunięcia „${e.title}”`,r=>{e.deleted={by:ME.id,at:nowISO(),reason:r};hist(c.id,`Usunięto wpis (soft delete): ${e.title} — ${r}`);audit('wpis.usuniety',c.number,`„${e.title}” · treść: ${e.desc.slice(0,120)} · powód: ${r}`);save();rerender();toast('Wpis ukryty — zostaje w archiwum i audycie')},{ok:'Usuń'});
}
function correctionModal(id){
  const e=DB.entries.find(x=>x.id===id),c=CASE(e.caseId);
  modal('Wniosek o korektę',`<div class="note info" style="margin-bottom:12px">Wpis jest zatwierdzony. Proponowana zmiana trafi do Administratora; oryginał zostaje w historii.</div><div class="form">
    <label class="full">Nazwa<input class="f" name="title" value="${esc(e.title)}"></label><label class="full">Opis<textarea class="f" name="desc">${esc(e.desc)}</textarea></label>
    <label class="full">Uzasadnienie<textarea class="f" name="reason" required minlength="5"></textarea></label></div>`,{ok:'Wyślij wniosek',onOk:v=>{
    DB.corrections.push({id:uid('k'),entryId:id,caseId:c.id,by:ME.id,at:nowISO(),reason:v.reason,title:v.title,desc:v.desc,status:'pending'});
    notify('correction.request',c.id,'Wniosek o korektę zatwierdzonego wpisu',`${ME.name} · ${c.number} · ${e.title}`,admins(),{priority:'wazne',action:true});
    hist(c.id,`Wniosek o korektę: ${e.title}`);audit('korekta.wniosek',c.number,v.reason);save();rerender();toast('Wysłano wniosek do Administratora');
  }});
}
function decideCorrection(id,ok){
  need(isAdmin(),'Decyzja o korekcie: tylko Administrator.');
  const k=DB.corrections.find(x=>x.id===id),e=DB.entries.find(x=>x.id===k.entryId),c=CASE(k.caseId);
  k.status=ok?'approved':'rejected';k.decidedBy=ME.id;k.decidedAt=nowISO();
  if(ok){e.versions.push({at:nowISO(),by:k.by,title:e.title,desc:e.desc,reason:'Korekta zatwierdzona: '+k.reason});e.title=k.title;e.desc=k.desc}
  notify('correction.decided',c.id,`Korekta ${ok?'zatwierdzona':'odrzucona'}: ${e.title}`,c.number,[k.by]);
  hist(c.id,`Korekta ${ok?'zatwierdzona':'odrzucona'}: ${e.title}`);audit('korekta.decyzja',c.number,`${ok?'zatwierdzona':'odrzucona'} · ${k.reason}`);save();rerender();
}
function approveStage(id){
  const s=DB.stages.find(x=>x.id===id),c=CASE(s.caseId);need(isAdmin()||caseFlags(c).approve,'Brak uprawnienia do zatwierdzania etapu.');
  const go=extra=>{s.status='approved';s.approvedBy=ME.id;s.approvedAt=nowISO();Object.assign(s,extra);
    DB.entries.filter(e=>e.stage===s.id&&!e.deleted).forEach(e=>{e.locked=true;if(!e.approvedBy){e.approvedBy=ME.id;e.approvedAt=nowISO()}e.status='approved'});
    const nx=DB.stages.find(x=>x.caseId===c.id&&x.order===s.order+1);if(nx&&nx.status==='todo')nx.status='open';
    hist(c.id,`Zatwierdzono etap ${s.order}: ${s.name}${extra?.conflict?` (wynik: ${extra.conflict})`:''}`);audit('etap.zatwierdzony',c.number,s.name);selStage[c.id]=nx?.id;save();rerender();toast('Etap zatwierdzony i zablokowany')};
  if(s.conflict!==undefined)modal('Kontrola konfliktu interesów',`<p class="mut" style="margin-bottom:12px">Bez wyniku sprawdzenia klienta i strony przeciwnej nie można przejść dalej.</p><div class="form"><label class="full">Strona przeciwna<input class="f" name="opp" required placeholder="np. Bank X S.A."></label>
    <label class="full">Wynik<select class="f" name="res"><option>brak konfliktu</option><option>konflikt — odmowa prowadzenia</option></select></label></div>`,{ok:'Zatwierdź etap',onOk:v=>{if(v.res!=='brak konfliktu'){toast('Konflikt interesów — sprawy nie można prowadzić dalej',true);hist(c.id,`Wykryto konflikt interesów (strona przeciwna: ${v.opp})`);audit('konflikt.wykryty',c.number,v.opp);save();return}go({conflict:`brak konfliktu (strona przeciwna: ${v.opp})`})}});
  else if(confirm(`Zatwierdzić etap „${s.name}”? Wpisy i załączniki zostaną zablokowane.`))go();
}

/* --- Dokumenty z wersjami (§7) --- */
const ALLOWED_EXT=['pdf','doc','docx','odt','rtf','txt','xlsx','xls','ods','jpg','jpeg','png'],MAX_MB=25;
CTAB.dokumenty=c=>{
  const docs=DB.documents.filter(d=>d.caseId===c.id&&!d.deleted);
  return `<div class="card"><h3>Dokumenty (${docs.length}) <label class="btn sm pri">+ Dodaj plik<input type="file" hidden onchange="uploadDoc('${c.id}',this.files[0])" accept="${ALLOWED_EXT.map(x=>'.'+x).join(',')}"></label></h3>
  ${docs.length?`<div class="tw"><table><tr><th>Plik</th><th>Etap</th><th>Wersja</th><th>Dodał</th><th>SHA-256</th><th></th></tr>${docs.map(d=>{const v=d.versions[d.versions.length-1],s=d.stage&&DB.stages.find(x=>x.id===d.stage);return `<tr><td>📎 <b>${esc(d.name)}</b><br><small class="mut">${esc(v.size)}</small></td><td class="small">${s?esc(s.order+'. '+s.name):'—'}</td>
    <td><details><summary style="cursor:pointer">v${v.v}</summary>${d.versions.slice().reverse().map(x=>`<div class="small mut">v${x.v} · ${fDT(x.at)} · ${esc(U(x.by).name)}</div>`).join('')}</details></td><td>${av(v.by,26)}</td><td class="small mut" style="font-family:monospace">${v.sha.slice(0,12)}…</td>
    <td style="white-space:nowrap"><label class="btn sm">Nowa wersja<input type="file" hidden onchange="uploadDoc('${c.id}',this.files[0],'${d.id}')"></label> ${isAdmin()?`<button class="btn sm del" onclick="deleteDoc('${d.id}')">Usuń</button>`:''}</td></tr>`}).join('')}</table></div>`:'<div class="empty">Brak dokumentów</div>'}
  <p class="hint">Dozwolone: ${ALLOWED_EXT.join(', ')} · maks. ${MAX_MB} MB. Podmiana pliku = nowa wersja, poprzednie zostają do pobrania. W produkcji: szyfrowany magazyn i skan antywirusowy. W prototypie zapisujemy tylko metadane i skrót pliku — treść nie opuszcza przeglądarki.</p></div>`;
};
async function uploadDoc(caseId,file,docId){
  if(!file)return;const c=CASE(caseId);need(caseFlags(c).docs,'Brak dostępu do dokumentów.');
  const ext=file.name.split('.').pop().toLowerCase();
  if(!ALLOWED_EXT.includes(ext))return toast('Niedozwolony typ pliku',true);
  if(file.size>MAX_MB*1048576)return toast(`Plik większy niż ${MAX_MB} MB`,true);
  let sha;try{const b=await crypto.subtle.digest('SHA-256',await file.arrayBuffer());sha=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){sha=sha256(file.name+file.size)}
  const size=file.size>1048576?(file.size/1048576).toFixed(1)+' MB':Math.max(1,Math.round(file.size/1024))+' KB';
  if(docId){const d=DB.documents.find(x=>x.id===docId);d.versions.push({v:d.versions.length+1,at:nowISO(),by:ME.id,size,sha});hist(c.id,`Nowa wersja dokumentu ${d.name} (v${d.versions.length})`);audit('dokument.wersja',c.number,`${d.name} v${d.versions.length} · ${sha.slice(0,16)}`)}
  else{const open=DB.stages.find(s=>s.caseId===c.id&&s.status==='open');DB.documents.push({id:uid('d'),caseId:c.id,stage:open?.id||null,name:file.name,versions:[{v:1,at:nowISO(),by:ME.id,size,sha}],deleted:false});hist(c.id,`Dodano dokument: ${file.name}`);audit('dokument.dodany',c.number,`${file.name} · ${sha.slice(0,16)}`);
    notify('document.added',c.id,`Dodano dokument: ${file.name}`,c.number,teamOf(c).map(m=>m.userId).filter(u=>u!==ME.id))}
  save();rerender();toast('Zapisano dokument');
}
function deleteDoc(id){const d=DB.documents.find(x=>x.id===id),c=CASE(d.caseId);askReason('Usuń dokument',`Uzasadnienie usunięcia „${d.name}”`,r=>{d.deleted={by:ME.id,at:nowISO(),reason:r};hist(c.id,`Usunięto dokument (soft delete): ${d.name} — ${r}`);audit('dokument.usuniety',c.number,`${d.name} · ${r}`);save();rerender()},{ok:'Usuń'})}

/* --- Zespół sprawy (§6) --- */

  const all=DB.members.filter(m=>m.caseId===c.id),act=teamOf(c),old=all.filter(m=>!act.includes(m));

  return `<div class="grid g2" style="align-items:start"><div class="card"><h3>Zespół sprawy · ${esc(c.number)} ${isAdmin()?`<button class="btn sm pri" onclick="memberModal('${c.id}')">+ Dodaj osobę do sprawy</button>`:''}</h3>

/* ===================== TERMINY (§5) ===================== */

function dlActions(d){

  const a=[];

  if(can('deadlines_close')||isAdmin()||d.responsible===ME.id&&d.type==='internal')a.push(`<button class="btn sm" onclick="doneDl('${d.id}')">Wykonano</button>`);

  const cells=Array.from({length:42},(_,i)=>addDays(start,i));const H=holidaySet(y);

  return `<div class="ph"><div><h1>Terminy procesowe</h1><p>Kalkulator, kontrola drugiej osoby, przypomnienia T-14/7/3/1/0 i eskalacja po przekroczeniu.</p></div>

    <div class="cal">${['Pn','Wt','Śr','Cz','Pt','So','Nd'].map(d=>`<div class="dh">${d}</div>`).join('')}${cells.map(d=>{const di=iso(d),ev=dls.filter(x=>x.final===di),hol=holidaySet(d.getFullYear()).get(di);
      return `<div class="d ${d.getMonth()!==m?'out':''} ${di===iso(t)?'today':''} ${hol||d.getDay()===0?'hol':''}" title="${esc(hol||'')}"><b>${d.getDate()}</b>${hol?` <small class="mut">${esc(hol.split(' ')[0])}</small>`:''}${ev.map(x=>{const s=dlStatus(x),col={overdue:'var(--bad)',urgent:'var(--bad)',soon:'#d97706',open:'var(--info)',done:'var(--good)'}[s.k];return `<a class="ev" style="background:${col}" href="#/sprawa/${x.caseId}/terminy" title="${esc(x.title)}">${esc(x.time?x.time+' ':'')}${esc(x.title)}</a>`}).join('')}</div>`}).join('')}</div>
    <div class="chips" style="margin-top:10px"><span class="badge b-info">otwarty</span><span class="badge b-warn">zbliża się (≤7 dni)</span><span class="badge b-bad">pilny / przekroczony</span><span class="badge b-good">wykonany</span></div></div>
  <div class="card"><h3>Kalkulator terminu</h3>
    <div class="form"><label>Zdarzenie (np. doręczenie)<input class="f" type="date" id="kTrig" value="${iso(t)}"></label><label>Długość<input class="f" type="number" id="kLen" value="30" min="1"></label>
      <label>Jednostka<select class="f" id="kUnit"><option>dni</option><option>tygodnie</option><option>miesiące</option><option>lata</option></select></label></div>
    <div id="kOut" style="margin-top:12px"></div>
    <p class="hint">Dni liczone od dnia następnego po zdarzeniu. Koniec w sobotę lub dzień ustawowo wolny → następny dzień roboczy (art. 115 KC). Reguły liczenia zweryfikuje prawnik przed wdrożeniem.</p></div></div>
  <div class="card" style="margin-top:14px"><h3>Najbliższe terminy (${open.length})</h3>${open.length?open.map(d=>dlRow(d)+dlActions(d)).join(''):'<div class="empty">Brak otwartych terminów</div>'}</div>
  <div class="card" style="margin-top:14px"><h3>Harmonogram przypomnień i eskalacji</h3><div class="grid g3 small">
    <div><b>T-14 dni</b><br><span class="mut">odpowiedzialny</span></div><div><b>T-7 dni</b><br><span class="mut">+ kontroler (druga osoba)</span></div><div><b>T-3 dni</b><br><span class="mut">+ pełnomocnik prowadzący</span></div>
    <div><b>T-1 dzień</b><br><span class="mut">+ SMS (opcjonalnie)</span></div><div><b>Dzień terminu</b><br><span class="mut">8:00, wszyscy, priorytet pilne</span></div><div><b>Po terminie</b><br><span class="mut">codziennie do Administratora, aż do „wykonano”</span></div></div>

function deadlineModal(caseId){

    const c=CASE(v.case);need(c&&canCase(c),'Brak dostępu do sprawy.');

    DB.deadlines.push(d);hist(c.id,`Nowy termin: ${d.title} — ${fD(d.final)}${man?` (nadpisano ręcznie: ${v.why})`:''}`);audit('termin.dodany',c.number,`${d.title} · ${d.final}${man?' · ręcznie: '+v.why:''}`);
    notify('deadline.new',c.id,`Nowy termin: ${d.title}`,`${c.number} · ${fD(d.final)}`,[d.responsible,d.controller].filter(x=>x!==ME.id),{priority:'normalne',action:!!d.controller});
    save();rerender();toast('Dodano termin');
  }});
  const f=()=>{const r=computeDeadline($('#dTrig').value,+$('#dLen').value||0,$('#dUnit').value);$('#dCalc').innerHTML=`<div class="note info">${esc(r.formula)} → <b>termin upływa ${fD(r.final)} (${DOW[parseD(r.final).getDay()]})</b>${r.moved?`<br><small>${esc(r.why)}</small>`:''}</div>`;

  ['dTrig','dLen','dUnit','dMan','dType'].forEach(i=>$('#'+i).oninput=f);$('#dMan').onchange=f;f();

function confirmDl(id){const d=DB.deadlines.find(x=>x.id===id),c=CASE(d.caseId);need(d.controller===ME.id,'Potwierdza wyłącznie wyznaczony kontroler.');d.controllerOk=nowISO();hist(c.id,`Kontroler potwierdził datę terminu: ${d.title} (${fD(d.final)})`);audit('termin.kontrola',c.number,d.title);save();rerender();toast('Potwierdzono poprawność daty')}
function doneDl(id){

/* ===================== POWIADOMIENIA (§10) ===================== */

    const recipient=v.type==='attorney'?v.att:v.rec,amt=Math.round(+v.amount*100)/100,others=DB.allocations.filter(x=>x.paymentId===pid&&x.id!==aid).reduce((s,x)=>s+x.amount,0);

function allocStatus(aid,st){

let CALCS=null;
CTAB.analiza=c=>{

    <div><div class="mut small">Dane wpisane przez klienta</div>${l.inputs.map(i=>`<div class="small">${esc(i.label)}: <b>${(+i.value).toLocaleString('pl-PL')} ${esc(i.unit||'')}</b></div>`).join('')}</div></div></div>`:''}
  <div class="card"><h3>Kalkulatory <span class="mut small">te same wzory co na stronie — zespół może przeliczyć na danych z umowy</span></h3><div id="calcArea"><div class="empty">Wczytywanie kalkulatorów…</div></div></div>`;
};
async function loadCalcs(c){
  try{if(!CALCS){const d=await (await fetch('data.json',{cache:'no-store'})).json();CALCS=d.calculators}}catch(e){$('#calcArea').innerHTML='<div class="empty">Nie udało się wczytać data.json (uruchom przez serwer).</div>';return}
  const pref=CALCS.find(x=>x.crmCategory===c.category)||CALCS[0];
  $('#calcArea').innerHTML=`<div class="toolbar"><select class="f" id="caSel">${CALCS.map(x=>`<option value="${x.id}" ${x.id===pref.id?'selected':''}>${esc(x.icon||'')} ${esc(x.name)}</option>`).join('')}</select></div><div id="caBox"></div>`;
  const draw=()=>{const k=CALCS.find(x=>x.id===$('#caSel').value),pre=c.leadData&&k.name===c.leadData.name?Object.fromEntries(c.leadData.inputs.map(i=>[i.label,i.value])):{};
    $('#caBox').innerHTML=`<div class="calcbox"><div class="form">${k.inputs.map(i=>`<label>${esc(i.label)} (${esc(i.unit||'')})<input class="f" type="number" step="any" data-k="${esc(i.key)}" value="${pre[i.label]??i.default}"></label>`).join('')}</div><div class="card res" id="caRes" style="background:var(--bg2)"></div></div>${k.note?`<p class="hint">${esc(k.note)}</p>`:''}
      ${caseFlags(c).actions&&c.status==='open'?'<button class="btn pri" id="caSave" style="margin-top:12px">Zapisz wynik jako czynność „analiza”</button>':''}`;
    const run=()=>{const vals=Object.fromEntries($$('#caBox [data-k]').map(i=>[i.dataset.k,parseFloat(i.value)||0])),scope={...vals};
      const out=k.outputs.map(o=>{let v=NaN;try{v=Number(new Function(...Object.keys(scope),'with(Math){return ('+o.formula+')}')(...Object.values(scope)))}catch(e){}scope[o.key]=v;return{...o,v}});
      const main=out.find(o=>o.main)||out[0],f=(v,d)=>Number.isFinite(v)?v.toLocaleString('pl-PL',{minimumFractionDigits:d||0,maximumFractionDigits:d||0}):'—';
      $('#caRes').innerHTML=`<span class="mut">${esc(main.label)}</span><div class="main">${f(main.v,main.decimals)} ${esc(main.unit||'')}</div>${out.filter(o=>o!==main).map(o=>`<div class="sub"><span>${esc(o.label)}</span><b>${f(o.v,o.decimals)} ${esc(o.unit||'')}</b></div>`).join('')}`;
      return{vals,out,main,f}};
    $$('#caBox [data-k]').forEach(i=>i.oninput=run);run();
    const sv=$('#caSave');if(sv)sv.onclick=()=>{const r=run(),st=DB.stages.find(s=>s.caseId===c.id&&s.status==='open');if(!st)return toast('Brak otwartego etapu',true);
      DB.entries.push({id:uid('e'),caseId:c.id,stage:st.id,type:'czynność',kind:'analiza',title:`Kalkulacja: ${k.name}`,desc:`${r.main.label}: ${r.f(r.main.v,r.main.decimals)} ${r.main.unit||''}\n`+k.inputs.map(i=>`${i.label}: ${r.vals[i.key]} ${i.unit||''}`).join('\n'),performedOn:iso(today()),performedBy:ME.id,status:'draft',locked:false,files:[],versions:[],created:nowISO()});
      hist(c.id,`Zapisano kalkulację: ${k.name}`);audit('wpis.dodany',c.number,`Kalkulacja ${k.name}`);save();toast(`Zapisano w etapie „${st.name}”`)}};
  $('#caSel').onchange=draw;draw();
}

function moveCat(code,d){const cs=[...DB.categories].sort((a,b)=>a.order-b.order),i=cs.findIndex(c=>c.code===code),j=i+d;[cs[i].order,cs[j].order]=[cs[j].order,cs[i].order];audit('konfiguracja.kolejnosc',code,d<0?'w górę':'w dół');save();rerender()}

  const u=U(selUser),ov=DB.overrides[u.id]||{};

  return `<div class="card" style="margin-bottom:14px"><h3>Role i uprawnienia (domyślne)</h3><div class="tw"><table class="mx"><tr><th>Funkcja</th>${Object.values(ROLES).map(r=>`<th>${r}</th>`).join('')}</tr>
    ${PERMS.map(([k,l])=>`<tr><td>${l}</td>${Object.keys(ROLES).map(r=>`<td>${mark(ROLE_DEF[r][k]||0)}</td>`).join('')}</tr>`).join('')}</table></div>
    <p class="hint"><span class="m-full">●</span> pełny dostęp · <span class="m-lim">◐</span> zakres ograniczony: przypisane sprawy / własne dane / wg uprawnienia · <span class="m-none">—</span> brak dostępu. Dostęp końcowy = rola + nadania + przypisanie do sprawy.</p></div>
  <div class="grid" style="grid-template-columns:300px 1fr;align-items:start">
    <div class="card"><h3>Użytkownicy <button class="btn sm pri" onclick="userModal()">+ Dodaj</button></h3>${users.map(x=>`<div class="stg ${x.id===u.id?'on':''}" onclick="selUser='${x.id}';rerender()" style="${x.active===false?'opacity:.5':''}">${av(x.id)}<div><b style="font-size:.88rem">${esc(x.name)}</b><br><small class="mut">${esc(ROLES[x.role])}${x.active===false?' · nieaktywny':''}</small></div></div>`).join('')}</div>
    <div class="card"><h3><span style="display:flex;gap:10px;align-items:center">${av(u.id,36)} Nadawanie uprawnień · ${esc(u.name)}</span><span><button class="btn sm" onclick="userModal('${u.id}')">Rola / konto</button></span></h3>
      <form id="permForm"><div class="tw"><table><tr><th>Uprawnienie</th><th>Z roli (${esc(ROLES[u.role])})</th><th>Nadanie indywidualne</th><th>Ważne do</th></tr>
      ${PERMS.map(([k,l])=>{const o=ov[k],rv=ROLE_DEF[u.role]?.[k]||0,exp=o&&o.until&&o.until<iso(today());return `<tr><td>${l}</td><td>${mark(rv)}</td>
        <td><select class="f" name="p_${k}" style="width:auto"><option value="">wg roli</option><option value="2" ${o?.value===2?'selected':''}>nadaj — pełny</option><option value="1" ${o?.value===1?'selected':''}>nadaj — ograniczony</option><option value="0" ${o&&o.value===0?'selected':''}>odbierz</option></select>${exp?' <span class="badge b-bad">wygasło</span>':''}</td>
        <td><input class="f" type="date" name="u_${k}" value="${o?.until||''}" style="width:auto"></td></tr>`}).join('')}</table></div>
      <label class="fl" style="margin-top:12px">Uzasadnienie (wymagane przy każdej zmianie)<textarea class="f" name="reason" placeholder="np. Aplikantka przygotowuje rozliczenie sprawy SKD-2026-0001"></textarea></label>
      <div class="mfoot"><button class="btn pri">Zapisz uprawnienia</button></div></form>
      <p class="hint">Zmiana działa od razu (od następnego żądania) i trafia do audytu: kto, komu, co, kiedy, dlaczego. Puste „Ważne do” = bezterminowo. Zmiana uprawnień Administratora wymaga hasła i 2FA.</p></div></div>`;
};
ROUTES.ustawienia.after=sub=>{
  const f=$('#permForm');if(f)f.onsubmit=e=>{e.preventDefault();
    const u=U(selUser),v=Object.fromEntries(new FormData(f)),ch=[];DB.overrides[u.id]=DB.overrides[u.id]||{};const ov=DB.overrides[u.id];
    PERMS.forEach(([k])=>{const nv=v['p_'+k]===''?null:+v['p_'+k],until=v['u_'+k]||null,o=ov[k];
      if(nv===null&&o){delete ov[k];ch.push(`${PERM_NAME[k]}: wg roli`)}
      else if(nv!==null&&(!o||o.value!==nv||(o.until||null)!==until)){ov[k]={value:nv,until,by:ME.id,at:nowISO()};ch.push(`${PERM_NAME[k]}: ${nv===0?'odebrano':nv===2?'nadano (pełny)':'nadano (ograniczony)'}${until?' do '+fD(until):' bezterminowo'}`)}});
    if(!ch.length)return toast('Brak zmian');
    if((v.reason||'').trim().length<5)return toast('Podaj uzasadnienie zmiany',true);
    const fin=()=>{ch.forEach(x=>audit('uprawnienia.zmiana',u.name,`${x} · ${v.reason.trim()}`));notify('perm.change',null,'Zmieniono Twoje uprawnienia',ch.join('; '),[u.id]);save();rerender();toast(`Zapisano ${ch.length} zmian — działa od razu`)};
    if(u.role==='admin')modal('Potwierdź hasłem i 2FA',`<div class="form"><label>Hasło<input class="f" type="password" name="pw" required></label><label>Kod 2FA<input class="f" name="code" required pattern="\\d{6}" placeholder="6 cyfr"></label></div><p class="hint">Prototyp: dowolne hasło i 6 cyfr.</p>`,{ok:'Potwierdź',onOk:fin});else fin();
  };
};
function userModal(id){
  const u=id&&U(id);
  modal(u?`Konto — ${u.name}`:'Nowy użytkownik',`<div class="form"><label>Imię i nazwisko<input class="f" name="name" required value="${esc(u?.name||'')}"></label><label>E-mail<input class="f" type="email" name="email" required value="${esc(u?.email||'')}"></label>
    <label>Rola<select class="f" name="role">${Object.entries(ROLES).map(([k,l])=>`<option value="${k}" ${u?.role===k?'selected':''}>${l}</option>`).join('')}</select></label>
    ${u?`<label class="chk" style="align-self:end"><input type="checkbox" name="active" ${u.active!==false?'checked':''}>Konto aktywne</label>`:''}
    <label class="full">Uzasadnienie<input class="f" name="reason" required minlength="5"></label></div><p class="hint">W systemie zawsze musi być co najmniej jeden aktywny Administrator. 2FA obowiązkowe: Administrator, pełnomocnicy, obsługa techniczna.</p>`,{onOk:v=>{
    const active=u?!!v.active:true,adminsLeft=DB.users.filter(x=>x.role==='admin'&&x.active!==false&&x.id!==u?.id).length+((v.role==='admin'&&active)?1:0);
    if(adminsLeft<1){toast('Musi zostać co najmniej jeden aktywny Administrator',true);return false}
    if(u){const ch=[];if(u.role!==v.role)ch.push(`rola: ${ROLES[u.role]} → ${ROLES[v.role]}`);if((u.active!==false)!==active)ch.push(active?'aktywowano':'dezaktywowano');Object.assign(u,{name:v.name,email:v.email,role:v.role,active});audit('uzytkownik.zmiana',u.name,`${ch.join(', ')||'dane konta'} · ${v.reason}`)}
    else{const n={id:uid('u'),name:v.name,email:v.email,role:v.role,color:COLORS[DB.users.length%COLORS.length],active:true};DB.users.push(n);selUser=n.id;audit('uzytkownik.utworzony',n.name,`${ROLES[n.role]} · ${v.reason}`)}
    save();rerender();
  }});
}

async function afterSignIn(){
  const {data:{user}}=await sb.auth.getUser();if(!user)return loginView('password');
  SESSION_UID=user.id;
  const p=(await sb.from('profiles').select('*').eq('id',user.id).single()).data;
  if(!p||!p.active)return loginView('inactive',{email:user.email});
  const aal=(await sb.auth.mfa.getAuthenticatorAssuranceLevel()).data;
  if(NEED_2FA.includes(p.role)&&aal?.currentLevel!=='aal2'){
    const f=(await sb.auth.mfa.listFactors()).data;const tot=(f?.totp||[]).find(x=>x.status==='verified');
    if(tot)return loginView('verify',{factorId:tot.id});
    (f?.all||[]).filter(x=>x.factor_type==='totp'&&x.status!=='verified').forEach(x=>sb.auth.mfa.unenroll({factorId:x.id}));
    const en=await sb.auth.mfa.enroll({factorType:'totp',friendlyName:'CRM '+new Date().toISOString().slice(0,10)});
    if(en.error){loginView('password');return toast(errMsg(en.error),true)}
    return loginView('enroll',{factorId:en.data.id,qr:en.data.totp.qr_code,secret:en.data.totp.secret});
  }
  loginView('loading');
  ME={id:p.id,name:p.full_name||p.email,role:p.role,email:p.email,color:p.color};
  try{await reload()}catch(e){console.error(e);return toast('Nie udało się wczytać danych: '+errMsg(e),true)}
  if(!sessionStorage.getItem('crm_logged_'+p.id)){sessionStorage.setItem('crm_logged_'+p.id,1);sb.rpc('log_login',{p_action:'logowanie'})}
  $('#login').style.display='none';$('#app').style.display='grid';
  if(!location.hash||location.hash==='#'||/access_token|type=/.test(location.hash))location.hash=ME.role==='tech'?'#/ustawienia/system':'#/pulpit';else route();
}

async function sha256File(file){const b=await crypto.subtle.digest('SHA-256',await file.arrayBuffer());return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const safeName=n=>n.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ł/g,'l').replace(/Ł/g,'L').replace(/[^\w.\-]+/g,'_').slice(-120);
async function storeFile(caseId,file,{docId,stageId,entryId,name}={}){
  const ext=file.name.split('.').pop().toLowerCase();
  if(!ALLOWED_EXT.includes(ext))throw new Error('Niedozwolony typ pliku: .'+ext);
  if(file.size>MAX_MB*1048576)throw new Error(`Plik większy niż ${MAX_MB} MB`);
  const sha=await sha256File(file),id=docId||crypto.randomUUID(),path=`${caseId}/${id}/${Date.now()}-${safeName(file.name)}`;
  chk(await sb.storage.from('akta').upload(path,file,{upsert:false,contentType:file.type||'application/octet-stream'}));
  if(!docId)chk(await sb.from('documents').insert({id,case_id:caseId,stage_id:stageId||null,entry_id:entryId||null,name:name||file.name}));
  chk(await sb.from('document_versions').insert({document_id:id,version:0,storage_path:path,size_bytes:file.size,sha256:sha}));
  return id;
}

    <li>Otwórz <a href="https://supabase.com/dashboard/project/ixlhfhzgzotukstoezcj/auth/users" target="_blank" style="color:var(--accent)">Supabase → Authentication → Users</a> → <b>Add user</b> → <b>Create new user</b> (zaznacz <i>Auto Confirm User</i>) albo <b>Send invitation</b>.</li>
    <li>Wróć tutaj i odśwież — konto pojawi się na liście jako <b>nieaktywne</b>.</li><li>Ustaw rolę, nazwę i aktywuj konto przyciskiem „Rola / konto”.</li></ol>
    <p class="hint">Konta zakłada tylko Administrator; samodzielna rejestracja jest wyłączona. Pełnomocnik, Administrator i Obsługa techniczna przy pierwszym logowaniu skonfigurują 2FA.</p>`,{ok:'Odśwież listę',onOk:()=>act(async()=>{})});
  modal(`Konto — ${u.name}`,`<div class="form"><label>Imię i nazwisko<input class="f" name="name" required value="${esc(u.name||'')}"></label><label>E-mail<input class="f" value="${esc(u.email||'')}" disabled></label>
    <label>Rola<select class="f" name="role">${Object.entries(ROLES).map(([k,l])=>`<option value="${k}" ${u.role===k?'selected':''}>${l}</option>`).join('')}</select></label>
    <label class="chk" style="align-self:end"><input type="checkbox" name="active" ${u.active!==false?'checked':''}>Konto aktywne</label></div><p class="hint">W systemie musi zostać co najmniej jeden aktywny Administrator (pilnuje tego baza). Zmiana trafia do audytu.</p>`,
  {onOk:v=>act(async()=>chk(await sb.from('profiles').update({full_name:v.name.trim(),role:v.role,active:!!v.active}).eq('id',u.id)),'Zapisano konto')});
}
{const after=ROUTES.ustawienia.after;ROUTES.ustawienia.after=sub=>{after?.(sub);const f=$('#permForm');if(!f)return;
  f.onsubmit=async e=>{e.preventDefault();const u=U(selUser),v=Object.fromEntries(new FormData(f)),ov=DB.overrides[u.id]||{},ups=[],dels=[];
    PERMS.forEach(([k])=>{const nv=v['p_'+k]===''?null:+v['p_'+k],until=v['u_'+k]||null,o=ov[k];
      if(nv===null&&o)dels.push(k);else if(nv!==null&&(!o||o.value!==nv||(o.until||null)!==until))ups.push({user_id:u.id,perm:k,level:nv,valid_until:until,reason:(v.reason||'').trim(),granted_by:ME.id,granted_at:new Date().toISOString()})});
    if(!ups.length&&!dels.length)return toast('Brak zmian');
    if((v.reason||'').trim().length<5)return toast('Podaj uzasadnienie zmiany',true);
    actSafe(async()=>{if(ups.length)chk(await sb.from('permission_overrides').upsert(ups));for(const k of dels)chk(await sb.from('permission_overrides').delete().eq('user_id',u.id).eq('perm',k))},`Zapisano ${ups.length+dels.length} zmian — działa od razu`)}}}

/* --- system i audyt (wersja na żywo) --- */
SET.system=()=>{
  const em=DB.emergency;
  return `<div class="grid g3" style="margin-bottom:14px"><div class="tile"><span>Baza</span><b style="color:var(--good);font-size:1.3rem">Supabase · UE</b><small class="mut">PostgreSQL 17 · RLS · 2FA</small></div>
    <div class="tile"><span>Kopie zapasowe</span><b style="font-size:1.1rem">wg planu Supabase</b><small><a href="https://supabase.com/dashboard/project/ixlhfhzgzotukstoezcj/database/backups/scheduled" target="_blank" style="color:var(--accent)">Database → Backups</a></small></div>
    <div class="tile"><span>Przypomnienia o terminach</span><b style="font-size:1.1rem">co 15 min</b><small class="mut">pg_cron · run_deadline_reminders()</small></div></div>
  <div class="grid g2" style="align-items:start"><div class="card"><h3>Dostęp awaryjny</h3>${ME.role==='tech'?(em&&em.status==='granted'&&em.until>Date.now()?`<div class="note info">Aktywny do ${fDT(new Date(em.until).toISOString())}</div>`:em&&em.status==='pending'?'<div class="note">Wniosek czeka na zgodę Administratora</div>':`<button class="btn" onclick="askReason('Wniosek o dostęp awaryjny','Powód (np. awaria, której nie da się zdiagnozować bez wglądu)',r=>act(async()=>chk(await sb.from('emergency_access').insert({reason:r})),'Wniosek wysłany'),{ok:'Wyślij',danger:false})">Złóż wniosek</button>`):
      em&&em.status==='pending'?`<div class="note">${esc(U(em.by).name)}: ${esc(em.reason)}</div><div style="margin-top:10px;display:flex;gap:8px"><button class="btn pri sm" onclick="actSafe(async()=>chk(await sb.from('emergency_access').update({status:'granted',decided_by:ME.id,valid_until:new Date(Date.now()+59*60000).toISOString()}).eq('id','${em.id}')),'Zgoda na 60 min')">Zgoda na 60 min</button><button class="btn sm del" onclick="actSafe(async()=>chk(await sb.from('emergency_access').update({status:'rejected',decided_by:ME.id}).eq('id','${em.id}')),'Odmówiono')">Odmów</button></div>`:'<p class="mut">Brak wniosków.</p>'}
    <p class="hint">Wniosek → zgoda Administratora → dostęp czasowy (60 min) → zapis w audycie. Poza tym obsługa techniczna nie odczyta żadnej sprawy, dokumentu ani rozliczenia — pilnuje tego baza.</p></div>
  <div class="card"><h3>Konfiguracja</h3><div class="small" style="line-height:1.9">
    <a href="https://supabase.com/dashboard/project/ixlhfhzgzotukstoezcj/auth/users" target="_blank" style="color:var(--accent)">Użytkownicy (Supabase Auth)</a><br>
    <a href="https://supabase.com/dashboard/project/ixlhfhzgzotukstoezcj/logs/explorer" target="_blank" style="color:var(--accent)">Logi techniczne</a><br>
    <a href="https://supabase.com/dashboard/project/ixlhfhzgzotukstoezcj/storage/buckets/akta" target="_blank" style="color:var(--accent)">Magazyn akt</a></div>
    <p class="hint">Test odtwarzania kopii: co kwartał na osobnym projekcie testowym (procedura w SUPABASE.md).</p></div></div>`;
};
{const orig=SET.audyt;SET.audyt=()=>orig().replace(/onclick="const r=verifyAudit\(\);[^"]*"/,`onclick="verifyAuditLive()"`).replace(/<button class="btn sm" onclick="toast\('UPDATE\/DELETE odrzucone[^"]*">Test: edytuj wpis<\/button>/,`<button class="btn sm" onclick="tryEditAudit()">Test: edytuj wpis</button>`)}
async function verifyAuditLive(){try{const r=chk(await sb.rpc('verify_audit_chain'))[0];toast(r.ok?`Łańcuch skrótów poprawny (${r.checked} wpisów)`:`Wykryto manipulację przy wpisie #${r.broken_at}`,!r.ok)}catch(e){toast(errMsg(e),true)}}
async function tryEditAudit(){const r=await sb.from('audit_log').update({details:'test'}).eq('id',1).select('id');toast(r.error?'Baza odrzuciła zmianę: '+errMsg(r.error):(r.data?.length?'UWAGA: zmiana przeszła!':'Baza odrzuciła zmianę — dziennik przyjmuje tylko dopisywanie'),!r.error&&r.data?.length)}

/* --- start --- */
let startedOnce=false;
sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY'){$('#login').style.display='grid';$('#app').style.display='none';loginView('newpass')}});
(async()=>{
  if(/type=recovery/.test(location.hash))return; // obsłuży onAuthStateChange
  const {data:{session}}=await sb.auth.getSession();
  if(session)await afterSignIn();else loginView('password');
})();
setInterval(async()=>{if(ME&&DB&&document.visibilityState==='visible'){const r=await sb.from('notifications').select('id').eq('recipient_id',ME.id).is('read_at',null);const n=r.data?.length||0;if(n!==DB.notifications.filter(x=>x.recipient===ME.id&&!x.read).length){await reload();renderShell()}}},30000); // liczniki „na żywo”

</script>
</body>
