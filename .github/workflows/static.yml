# Publikacja strony na GitHub Pages + codzienna synchronizacja danych prawnych z API Sejmu.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  # codziennie ok. 6:17 czasu polskiego — strażnik zmian w prawie (tools/prawo_sync.py)
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write   # synchronizacja zapisuje prawo/*.json z powrotem do repozytorium
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Czy synchronizować prawo?
        id: want
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then echo "run=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          # przy wysyłce: tylko gdy zmieniła się lista ustaw lub skrypt, albo danych jeszcze nie ma
          if [ ! -f prawo/akty.json ] || git diff --name-only HEAD~1 HEAD | grep -qE '^(prawo/obserwowane\.json|tools/prawo_sync\.py)$'; then echo "run=1" >> "$GITHUB_OUTPUT"; else echo "run=0" >> "$GITHUB_OUTPUT"; fi
      - name: Synchronizacja z API Sejmu (ELI + procesy legislacyjne)
        if: steps.want.outputs.run == '1'
        continue-on-error: true
        timeout-minutes: 25
        run: |
          pip install --quiet pypdf
          python3 tools/prawo_sync.py
      - name: Zapis danych prawnych do repozytorium
        if: steps.want.outputs.run == '1'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prawo
          if git diff --cached --quiet; then echo "bez zmian"; exit 0; fi
          git commit -m "Dane prawne z API Sejmu ($(date -u +%F)) [automat]"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
      - name: Build SEO (meta tagi, robots.txt, sitemap.xml z data.json)
        run: python3 tools/build_seo.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
